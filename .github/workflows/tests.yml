name: Python and Linux packaging tests

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and ELF relocation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install 'setuptools>=77' wheel pytest numpy huggingface-hub
      - name: Test wrapper and installed ELF fixture wheel
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
