name: Linux HIP build and wheel validation

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hip:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QWENTTS_REF: 6fae92914045cd83364d2845ceaa0f7969727319
      ROCM_IMAGE: rocm/dev-ubuntu-24.04:7.2.4-complete@sha256:92f309c51b52cef8762867848f1529dee821624f23cd5df38455e819538f762f
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free space for the ROCm development image
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get clean
          df -h /
      - name: Fetch pinned native source
        run: |
          git init third_party/qwentts.cpp
          git -C third_party/qwentts.cpp remote add origin https://github.com/ServeurpersoCom/qwentts.cpp
          git -C third_party/qwentts.cpp fetch --depth 1 origin "$QWENTTS_REF"
          git -C third_party/qwentts.cpp checkout --detach FETCH_HEAD
          git -C third_party/qwentts.cpp submodule update --init --recursive --depth 1
      - name: Start the pinned ROCm build container
        run: |
          # No GPU devices are passed through: gfx942 is an explicit compile target.
          docker run --detach --name qwentts-hip \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$ROCM_IMAGE" sleep infinity
          docker exec qwentts-hip bash -euxo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build patchelf python3 python3-venv git ca-certificates
            git config --global --add safe.directory /workspace/third_party/qwentts.cpp
            git config --global --add safe.directory /workspace/third_party/qwentts.cpp/ggml
            python3 -m venv /opt/hip-test
            /opt/hip-test/bin/python -m pip install build twine pytest numpy huggingface-hub
            # These remain system dependencies; no native build path is added.
            printf "/opt/rocm/lib\n/opt/rocm/lib64\n" > /etc/ld.so.conf.d/qwentts-rocm.conf
            ldconfig
            /opt/rocm/bin/hipconfig --version
            /opt/rocm/llvm/bin/clang++ --version
          '
      - name: Build the real HIP runtime and local-version wheel
        run: |
          docker exec qwentts-hip bash -euxo pipefail -c '
            /opt/hip-test/bin/python scripts/build_native.py \
              --source third_party/qwentts.cpp --build-dir build/hip --backend hip \
              --hip-compiler /opt/rocm/llvm/bin/clang++ \
              --hip-architectures gfx942 --rocm-path /opt/rocm --jobs 2 --clean \
              --cmake-arg=-G --cmake-arg=Ninja
            test -f src/qwentts_cpp/lib/libggml-hip.so.0
            /opt/hip-test/bin/python scripts/set_local_version.py rocm724
            /opt/hip-test/bin/python -m build --wheel
            /opt/hip-test/bin/python -m twine check --strict dist/*.whl
            PYTHONPATH=src QWENTTS_CPP_SOURCE=third_party/qwentts.cpp \
              /opt/hip-test/bin/python -m pytest -q tests/test_native_abi.py tests/test_build_native.py
          '
      - name: Validate the installed HIP wheel without native source or build trees
        run: |
          docker exec qwentts-hip bash -euxo pipefail -c '
            /opt/hip-test/bin/python -m pip install --no-deps dist/*.whl
            rm -rf build third_party src/qwentts_cpp/lib
            unset QWENTTS_CPP_LIBRARY QWEN_LIBRARY_PATH LD_LIBRARY_PATH PYTHONPATH
            /opt/hip-test/bin/python -I -c "from pathlib import Path; from qwentts_cpp import QwenLibrary; lib = QwenLibrary(); print(lib.path, lib.version()); assert lib.path.is_relative_to(Path(\"/opt/hip-test\")); assert any(Path(dep._name).name == \"libggml-hip.so.0\" for dep in lib._dependency_handles)"
            # Inspect actual ELF dependencies after removing the build trees.
            for library in /opt/hip-test/lib/python*/site-packages/qwentts_cpp/lib/*.so*; do
              test "$(patchelf --print-rpath "$library")" = '\''$ORIGIN'\''
              dependencies="$(ldd "$library")"
              printf "%s\n" "$dependencies"
              if printf "%s\n" "$dependencies" | grep -E "not found|/workspace/"; then
                exit 1
              fi
            done
            # Native integration tests use the installed path, after the default
            # loader above has independently succeeded without any override.
            export QWENTTS_CPP_LIBRARY="$(/opt/hip-test/bin/python -I -c "from qwentts_cpp import QwenLibrary; print(QwenLibrary().path)")"
            /opt/hip-test/bin/python -m pytest -q tests
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hip-wheel-rocm724-gfx942-linux-x86_64
          path: dist/*.whl
          retention-days: 7
      - name: Remove the build container
        if: always()
        run: docker rm --force qwentts-hip || true
